---
apiVersion: kustomize.config.k8.io/v1bets1
kind: Kustomization
namespace: neo4j-dev
resources:
  - ../base
patches:
  - target:
      kind: Service
      name: neo4j-service
    patch: |-
      - op: replace
        path: /spec/type
        value: NodePort
configMapGenerator:
  - name: neo4j-config
    literals:
      - NEOJ_AUTH=my-dev-user/dev-password